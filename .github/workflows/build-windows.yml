name: Build My Switcher for Windows (EXE + Installer)

on:
  workflow_dispatch:
  push:
    paths:
      - "my_switcher.py"
      - "requirements.txt"
      - "installer.iss"
      - "tests/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile my_switcher.py
      - name: Test keyboard layout mappings
        run: python -m unittest discover -s tests -v
      - name: Build portable EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MySwitcher my_switcher.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload EXE and installer
        uses: actions/upload-artifact@v4
        with:
          name: MySwitcher-Windows-x64
          path: |
            dist/MySwitcher.exe
            installer-output/MySwitcher-Setup-x64.exe
          if-no-files-found: error
