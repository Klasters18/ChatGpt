name: Build My Switcher for Windows (EXE)

on:
  workflow_dispatch:
  push:
    paths:
      - "my_switcher.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m py_compile my_switcher.py
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MySwitcher my_switcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: MySwitcher-Windows-x64
          path: dist/MySwitcher.exe
          if-no-files-found: error
