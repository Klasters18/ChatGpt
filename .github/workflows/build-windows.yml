name: Build My Switcher for Windows (EXE + Installer)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "my_switcher.py"
      - "layout_engine.py"
      - "win_input.py"
      - "grammar_check.py"
      - "requirements.txt"
      - "installer.iss"
      - "tests/**"
      - ".github/workflows/build-windows.yml"
  push:
    paths:
      - "my_switcher.py"
      - "layout_engine.py"
      - "win_input.py"
      - "grammar_check.py"
      - "requirements.txt"
      - "installer.iss"
      - "tests/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download offline phrase models (CC BY)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          $base = "https://raw.githubusercontent.com/synth-inc/predictive-bigrams/76001baff94965b9cde7e07a4b0f007ead013a1d/data"
          foreach ($lang in @("en", "ru", "uk")) {
            Invoke-WebRequest -Uri "$base/${lang}_bigrams_50k.txt" -OutFile "models/${lang}_bigrams_50k.txt"
          }
      - name: Check Python syntax
        run: python -m py_compile my_switcher.py layout_engine.py grammar_check.py
      - name: Test keyboard layout mappings and grammar checker
        run: python -m unittest discover -s tests -v
      - name: Build portable EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all wordfreq --collect-all langcodes --add-data "models;models" --name MySwitcher my_switcher.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload EXE and installer
        uses: actions/upload-artifact@v4
        with:
          name: MySwitcher-Windows-x64
          path: |
            dist/MySwitcher.exe
            installer-output/MySwitcher-Setup-x64.exe
          if-no-files-found: error
